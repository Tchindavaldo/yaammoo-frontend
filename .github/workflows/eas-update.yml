# Publication d'une mise a jour OTA (expo-updates) depuis GitHub, pas depuis le
# poste de dev : le bundle (~90 Mo de `dist`) est construit et uploade par le
# runner. La connexion locale ne transporte plus que le push git.
#
# Prerequis : secret `EXPO_TOKEN` dans Settings > Secrets and variables >
# Actions (jeton cree sur expo.dev > Account Settings > Access Tokens).
name: EAS Update

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Canal EAS cible
        type: choice
        options: [production, test, preview, development]
        default: production
      message:
        description: Message de la mise a jour
        type: string
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # VERROU : le canal `production` atteint les VRAIS clients. Il ne se
      # publie QUE depuis `main` (main = prod). Toute autre branche est refusée
      # avant même l'installation.
      - name: Verrou canal production
        if: inputs.channel == 'production' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::OTA production refusee : lancer le workflow depuis main (branche actuelle : ${{ github.ref_name }})."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `packager: npm` est OBLIGATOIRE : par defaut l'action installe eas-cli
      # avec yarn, absent des runners ubuntu recents → echec immediat.
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # Inscrit le message dans le manifeste : sans cela, l'app ne peut pas
      # savoir de quelle publication elle provient (cf. le script).
      - run: node scripts/stamp-update-message.mjs "${{ inputs.message }}"

      # `--environment` : charge les variables EAS du meme nom que le canal
      # (EXPO_PUBLIC_ORS_KEY…). `.env` est gitignore, absent du runner : sans
      # cela, l'OTA partirait sans cle et effacerait l'itineraire du Suivi.
      # EAS n'a que 3 environnements (development, preview, production) : le
      # canal `test` charge donc les variables de `preview`.
      - run: eas update --channel "${{ inputs.channel }}" --environment "${{ inputs.channel == 'test' && 'preview' || inputs.channel }}" --message "${{ inputs.message }}" --non-interactive
