plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.rauval.yaammoo'
version = '1.0.0'

expoModule {
  canBePublished false
}

android {
  namespace "com.rauval.yaammoo.notificationstyle"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Classes etendues (NotificationsService, ExpoPresentationDelegate) : memes
  // versions que celles qu'embarque expo-notifications.
  // ⚠️ SDK 57 : expo-notifications est livre PRECOMPILE (local-maven-repo),
  // plus comme projet Gradle ; `project(':expo-notifications')` fait echouer
  // le build. Version lue dans node_modules : suit les mises a jour d'Expo.
  def notifPkg = new groovy.json.JsonSlurper().parse(
    new File(rootDir, '../node_modules/expo-notifications/package.json'))
  implementation "host.exp.exponent:expo.modules.notifications:${notifPkg.version}"
  implementation 'androidx.core:core:1.17.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
  // RemoteMessage (lecture des donnees du push) : fourni a l'execution par
  // expo-notifications, qui fixe la version.
  compileOnly 'com.google.firebase:firebase-messaging:25.0.1'
}
